<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #282c34; }
      .wrapper { fill: #21252b; stroke: #61afef; stroke-width: 2; rx: 10; }
      .framework { fill: #2c313a; stroke: #c678dd; stroke-width: 1.5; rx: 8; }
      .external { fill: #2c313a; stroke: #e5c07b; stroke-width: 1.5; rx: 8; }
      .data { fill: #3e4451; stroke: #98c379; stroke-width: 1.5; rx: 5; }
      .main-text { fill: #e6e6e6; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .sub-text { fill: #abb2bf; font-size: 15px; text-anchor: middle; }
      .data-text { fill: #dcdfe4; font-size: 13px; text-anchor: middle; }
      .arrow { stroke: #56b6c2; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-text { fill: #56b6c2; font-size: 12px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56b6c2" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <title>harbor 评估工具集内部技术架构</title>

  <!-- Harbor Framework -->
  <g id="harbor-framework">
    <rect x="250" y="40" width="300" height="70" class="framework"/>
    <text x="400" y="75" class="main-text">Harbor Evaluation Framework</text>
    <text x="400" y="95" class="sub-text">(评估流程控制器)</text>
  </g>

  <!-- DeepAgents Wrapper -->
  <g id="deepagents-wrapper">
    <rect x="275" y="150" width="250" height="60" class="wrapper"/>
    <text x="400" y="180" class="main-text" style="font-size: 18px;">DeepAgentsWrapper</text>
    <text x="400" y="200" class="sub-text">(被测代理的包装器)</text>
  </g>
  <path class="arrow" d="M 400 110 V 150" />
  <text x="430" y="130" class="arrow-text">加载并执行</text>

  <!-- External Systems -->
  <g id="external-systems">
    <g id="terminal-bench">
      <rect x="50" y="250" width="220" height="90" class="external"/>
      <text x="160" y="280" class="sub-text">Terminal Bench 2.0</text>
      <text x="160" y="305" class="data-text">基准测试任务集</text>
      <rect x="70" y="320" width="180" height="10" class="data" />
    </g>

    <g id="sandbox">
        <rect x="290" y="350" width="220" height="70" class="external" />
        <text x="400" y="380" class="sub-text">Sandbox 环境</text>
        <text x="400" y="400" class="data-text">(Docker, Daytona, ...)</text>
    </g>

    <g id="langsmith">
      <rect x="530" y="250" width="220" height="90" class="external"/>
      <text x="640" y="280" class="sub-text">LangSmith</text>
      <text x="640" y="305" class="data-text">日志记录与分析平台</text>
      <path d="M 550 320 h 180 v 10 h -180 z" fill="#3e4451" stroke="#98c379" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M 250 80 H 160 C 100 80, 100 200, 160 250"/>
  <text x="150" y="150" class="arrow-text">1. 获取任务</text>

  <path class="arrow" d="M 400 210 V 350"/>
  <text x="360" y="280" class="arrow-text">3. 在沙盒中</text>
  <text x="360" y="295" class="arrow-text">  执行动作</text>

  <path class="arrow" d="M 275 180 C 200 180, 160 220, 160 250" />
  <text x="210" y="220" class="arrow-text">2. 代理尝试</text>
  <text x="210" y="235" class="arrow-text">  完成任务</text>

  <path class="arrow" d="M 525 180 C 600 180, 640 220, 640 250" />
  <text x="590" y="220" class="arrow-text">4. 记录轨迹</text>
  <text x="590" y="235" class="arrow-text">  (Traces)</text>

  <path class="arrow" d="M 550 80 H 640 C 700 80, 700 200, 640 250"/>
  <text x="650" y="150" class="arrow-text">5. 发送评估</text>
  <text x="650" y="165" class="arrow-text">   结果 (Reward)</text>

</svg>