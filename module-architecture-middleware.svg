<svg width="1200" height="850" viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-mw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#444" />
        </marker>
        <filter id="shadow-mw">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
            <feOffset dx="2" dy="2" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 1.5; filter: url(#shadow-mw); }
            .process-flow { fill: #E3F2FD; stroke: #90CAF9; }
            .middleware-box { fill: #FCE4EC; stroke: #F48FB1; }
            .hook-box { fill: #FFF; stroke: #F48FB1; stroke-width: 1; stroke-dasharray: 4 2; }
            .data-source { fill: #E0F2F1; stroke: #80CBC4; }
            .system-object { fill: #F5F5F5; stroke: #BDBDBD; }
            .title { font-size: 18px; font-weight: bold; text-anchor: middle; }
            .subtitle { font-size: 14px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 13px; text-anchor: middle; }
            .text-small { font-size: 11px; }
            .connector { stroke: #444; stroke-width: 2; marker-end: url(#arrow-mw); }
            .data-flow { stroke: #EC407A; stroke-width: 1.5; marker-end: url(#arrow-mw); }
        </style>
    </defs>

    <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle">Middleware 模块 - 详细技术架构图</text>

    <!-- Data Sources -->
    <g id="data-sources">
        <rect x="50" y="80" width="300" height="150" rx="10" class="box data-source" />
        <text x="200" y="110" class="subtitle">数据源 (文件系统)</text>
        <text x="200" y="145" class="text">~/.deepagents/.../agent.md</text>
        <text x="200" y="170" class="text">~/.deepagents/.../skills/*.md</text>
        <text x="200" y="195" class="text">./.deepagents/...</text>
    </g>

    <!-- Agent State -->
    <g id="agent-state">
        <rect x="850" y="80" width="300" height="150" rx="10" class="box system-object" />
        <text x="1000" y="110" class="subtitle">智能体状态 (AgentState)</text>
        <text x="1000" y="145" class="text" font-family="monospace">user_memory: str</text>
        <text x="1000" y="170" class="text" font-family="monospace">project_memory: str</text>
        <text x="1000" y="195" class="text" font-family="monospace">skills_metadata: list</text>
    </g>

    <!-- Main Process Flow -->
    <rect x="50" y="280" width="1100" height="520" rx="10" class="box process-flow" />
    <text x="600" y="310" class="title">中间件处理流程</text>

    <!-- Phase 1: Initialization -->
    <text x="325" y="350" class="subtitle">阶段 1: 会话启动 (before_agent)</text>
    <path d="M 75 370 H 575" class="connector" />
    <text x="325" y="365" class="text-small" fill="#555">Agent.stream() 首次调用时触发</text>

    <g id="init-flow">
        <!-- AgentMemoryMiddleware -->
        <rect x="100" y="390" width="450" height="100" rx="5" class="box middleware-box" />
        <text x="325" y="415" class="subtitle">AgentMemoryMiddleware</text>
        <rect x="110" y="430" width="430" height="50" rx="3" class="hook-box" />
        <text x="325" y="455" class="text">`before_agent`: 读取 `agent.md` 文件内容</text>

        <!-- SkillsMiddleware -->
        <rect x="100" y="510" width="450" height="100" rx="5" class="box middleware-box" />
        <text x="325" y="535" class="subtitle">SkillsMiddleware</text>
        <rect x="110" y="550" width="430" height="50" rx="3" class="hook-box" />
        <text x="325" y="575" class="text">`before_agent`: 扫描并解析 `SKILL.md` 元数据</text>

        <!-- Data Flow -->
        <path d="M 200 230 V 390" class="data-flow" />
        <text x="210" y="310" class="text-small" fill="#EC407A">1. 读取文件</text>

        <path d="M 550 440 H 850 V 230" class="data-flow" />
        <text x="700" y="350" class="text-small" fill="#EC407A">2. 更新 AgentState</text>
        <path d="M 550 560 H 860 V 230" class="data-flow" />
    </g>

    <!-- Phase 2: Model Call -->
    <text x="875" y="350" class="subtitle">阶段 2: 模型调用 (wrap_model_call)</text>
    <path d="M 625 370 H 1125" class="connector" />
    <text x="875" y="365" class="text-small" fill="#555">每次调用 LLM 前触发</text>

    <g id="runtime-flow">
        <!-- Input Request -->
        <rect x="650" y="390" width="450" height="50" rx="5" class="box system-object" />
        <text x="875" y="415" class="text">原始模型请求 (ModelRequest)</text>

        <path d="M 875 440 V 460" class="connector" />

        <!-- Middleware Stack -->
        <rect x="650" y="460" width="450" height="230" rx="5" class="box middleware-box" />
        <text x="875" y="485" class="subtitle">中间件调用链 (倒序执行)</text>

        <!-- ShellMiddleware -->
        <rect x="660" y="500" width="430" height="50" rx="3" class="hook-box" />
        <text x="875" y="525" class="text">`wrap_model_call` (ShellMiddleware): (可选逻辑)</text>

        <!-- SkillsMiddleware -->
        <rect x="660" y="560" width="430" height="50" rx="3" class="hook-box" />
        <text x="875" y="585" class="text">`wrap_model_call` (SkillsMiddleware): 注入技能列表</text>

        <!-- AgentMemoryMiddleware -->
        <rect x="660" y="620" width="430" height="50" rx="3" class="hook-box" />
        <text x="875" y="645" class="text">`wrap_model_call` (AgentMemoryMiddleware): 注入记忆内容</text>

        <path d="M 875 690 V 710" class="connector" />

        <!-- Output Request -->
        <rect x="650" y="710" width="450" height="70" rx="5" class="box system-object" />
        <text x="875" y="735" class="text">修改后的模型请求 (ModelRequest)</text>
        <text x="875" y="755" class="text" style="font-style:italic;">(包含记忆和技能的系统提示)</text>

        <!-- Data Flow -->
        <path d="M 1000 230 V 460" class="data-flow" />
        <text x="1010" y="350" class="text-small" fill="#EC407A">3. 读取状态</text>
    </g>

    <!-- Final Arrow to LLM -->
    <path d="M 875 780 V 820" class="connector" />
    <text x="885" y="805" class="text-small" fill="#555">发送至 LLM</text>
</svg>
