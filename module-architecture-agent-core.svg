<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-mod" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
        </marker>
        <filter id="shadow-mod" x="-0.2" y="-0.2" width="1.4" height="1.4">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
            <feOffset in="blur" dx="2" dy="2" result="offsetBlur" />
            <feMerge>
                <feMergeNode in="offsetBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 1.5; filter: url(#shadow-mod); }
            .main-component { fill: #E8F5E9; stroke: #A5D6A7; }
            .sub-component { fill: #C8E6C9; stroke: #81C78E; }
            .external-dep { fill: #F5F5F5; stroke: #BDBDBD; }
            .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 13px; text-anchor: middle; }
            .connector { stroke: #555; stroke-width: 2; marker-end: url(#arrow-mod); }
            .data-flow { stroke: #0288D1; stroke-width: 1.5; stroke-dasharray: 4 2; marker-end: url(#arrow-mod); }
        </style>
    </defs>

    <text x="400" y="40" font-size="20" font-weight="bold" text-anchor="middle">모듈 아키텍처: 에이전트 코어</text>

    <!-- Main Agent Container -->
    <rect x="150" y="80" width="500" height="480" rx="10" class="box main-component" />
    <text x="400" y="105" class="title">agent.py (create_cli_agent)</text>

    <!-- LangGraph Pregel -->
    <rect x="250" y="140" width="300" height="80" rx="5" class="box sub-component" />
    <text x="400" y="170" class="text">LangGraph Pregel</text>
    <text x="400" y="190" class="text" style="font-style: italic;">(에이전트 실행 엔진)</text>

    <!-- Middleware Stack -->
    <rect x="200" y="260" width="400" height="180" rx="5" class="box sub-component" />
    <text x="400" y="285" class="text" style="font-weight: bold;">미들웨어 스택</text>

    <rect x="225" y="310" width="160" height="110" rx="5" class="box" style="fill:#FCE4EC; stroke:#F48FB1;"/>
    <text x="305" y="340" class="text">AgentMemory</text>
    <text x="305" y="365" class="text">SkillsMiddleware</text>
    <text x="305" y="390" class="text">ShellMiddleware</text>

    <rect x="415" y="310" width="160" height="110" rx="5" class="box" style="fill:#FFF; stroke:#CCC;"/>
    <text x="495" y="340" class="text">... (기타)</text>


    <!-- System Prompt -->
    <rect x="250" y="480" width="300" height="60" rx="5" class="box sub-component" />
    <text x="400" y="510" class="text">시스템 프롬프트 구성</text>

    <!-- External Dependencies -->
    <rect x="25" y="140" width="150" height="60" rx="5" class="box external-dep" />
    <text x="100" y="170" class="text">execution.py</text>

    <rect x="625" y="200" width="150" height="60" rx="5" class="box external-dep" />
    <text x="700" y="230" class="text">LLM</text>

    <rect x="625" y="340" width="150" height="60" rx="5" class="box external-dep" />
    <text x="700" y="370" class="text">데이터 소스</text>

    <rect x="625" y="480" width="150" height="60" rx="5" class="box external-dep" />
    <text x="700" y="510" class="text">도구/백엔드</text>

    <!-- Connectors -->
    <path d="M 175 170 H 250" class="connector" />
    <text x="185" y="165" style="font-size:12px;">호출</text>

    <path d="M 550 180 H 625" class="data-flow" />
    <text x="560" y="175" style="font-size:12px;" fill="#0288D1">요청</text>
    <path d="M 625 220 H 550" class="data-flow" />
    <text x="560" y="225" style="font-size:12px;" fill="#0288D1">응답</text>

    <path d="M 400 220 V 260" class="connector" />

    <path d="M 385 370 H 200" class="connector" />
    <text x="250" y="445" style="font-size:12px;">프롬프트 수정</text>

    <path d="M 400 440 V 480" class="connector" />

    <path d="M 575 370 H 625" class="data-flow" />
    <text x="585" y="365" style="font-size:12px;" fill="#0288D1">로드</text>

    <path d="M 550 510 H 625" class="connector" />
    <text x="560" y="505" style="font-size:12px;">호출</text>
</svg>