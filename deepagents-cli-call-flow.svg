<svg width="1200" height="1150" viewBox="0 0 1200 1150" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-seq" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
        <style>
            .lifeline { stroke: #999; stroke-width: 1.5; }
            .activation { fill: #81D4FA; stroke: #0288D1; stroke-width: 1; }
            .message { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow-seq); }
            .reply-message { stroke: #333; stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#arrow-seq); }
            .lifeline-text { text-anchor: middle; font-size: 14px; font-weight: bold; }
            .message-text { font-size: 13px; }
            .note-box { fill: #FFF9C4; stroke: #FBC02D; stroke-width: 1; }
            .note-text { font-size: 12px; }
        </style>
    </defs>

    <text x="600" y="30" font-size="22" font-weight="bold" text-anchor="middle">Deep Agents CLI - 호출 흐름도 (사용자 명령어)</text>

    <!-- Lifelines -->
    <g>
        <line x1="100" y1="80" x2="100" y2="1100" class="lifeline" />
        <text x="100" y="70" class="lifeline-text">사용자</text>
    </g>
    <g>
        <line x1="300" y1="80" x2="300" y2="1100" class="lifeline" />
        <text x="300" y="70" class="lifeline-text">main.py (CLI)</text>
    </g>
    <g>
        <line x1="500" y1="80" x2="500" y2="1100" class="lifeline" />
        <text x="500" y="70" class="lifeline-text">execution.py</text>
    </g>
    <g>
        <line x1="700" y1="80" x2="700" y2="1100" class="lifeline" />
        <text x="700" y="70" class="lifeline-text">agent.py (LangGraph)</text>
    </g>
     <g>
        <line x1="900" y1="80" x2="900" y2="1100" class="lifeline" />
        <text x="900" y="70" class="lifeline-text">미들웨어</text>
    </g>
    <g>
        <line x1="1100" y1="80" x2="1100" y2="1100" class="lifeline" />
        <text x="1100" y="70" class="lifeline-text">도구/백엔드</text>
    </g>

    <!-- Activations and Messages -->

    <!-- 1. User runs command -->
    <rect x="95" y="100" width="10" height="30" class="activation" />
    <path d="M 100 115 H 295" class="message" />
    <text x="150" y="110" class="message-text">1. deepagents "..."</text>

    <!-- 2. CLI Initialization -->
    <rect x="295" y="115" width="10" height="960" class="activation" />
    <path d="M 300 130 H 495" class="message" />
    <text x="350" y="125" class="message-text">2. parse_args()</text>

    <!-- 3. Create Agent -->
    <path d="M 305 150 C 350 150, 350 170, 400 170" class="message" />
    <path d="M 400 170 H 695" class="message" />
    <text x="450" y="165" class="message-text">3. create_cli_agent()</text>
    <rect x="695" y="170" width="10" height="150" class="activation" />

    <!-- 4. Middleware Setup -->
    <path d="M 700 185 H 895" class="message" />
    <text x="750" y="180" class="message-text">4. 미들웨어 인스턴스화</text>
    <rect x="895" y="185" width="10" height="120" class="activation" />

    <!-- 5. Load Memory/Skills -->
    <path d="M 900 200 H 1095" class="message" />
    <text x="950" y="195" class="message-text">5. 메모리/기술 파일 읽기</text>
    <path d="M 1095 215 H 900" class="reply-message" />
    <text x="950" y="225" class="message-text">파일 내용</text>

    <!-- 6. Middleware before_agent hook -->
    <path d="M 895 240 H 700" class="reply-message" />
    <text x="750" y="250" class="message-text">6. before_agent() (상태 업데이트)</text>

    <!-- 7. Agent returns -->
    <path d="M 695 310 H 300" class="reply-message" />
    <text x="450" y="320" class="message-text">7. 에이전트 인스턴스 반환</text>

    <!-- 8. Start main loop -->
    <path d="M 300 340 H 495" class="message" />
    <text x="350" y="335" class="message-text">8. simple_cli()</text>
    <rect x="495" y="340" width="10" height="710" class="activation" />

    <!-- 9. User input -->
    <path d="M 105 360 C 150 360, 250 360, 295 360" class="message" />
    <text x="180" y="355" class="message-text">9. 사용자 입력 제공</text>
    <path d="M 300 375 H 495" class="message" />
    <text x="350" y="370" class="message-text">10. await session.prompt_async()</text>

    <!-- 11. Execute Task -->
    <path d="M 500 400 H 695" class="message" />
    <text x="550" y="395" class="message-text">11. agent.astream()</text>
    <rect x="695" y="400" width="10" height="520" class="activation" />

    <!-- 12. Model Call with Middleware -->
    <path d="M 700 415 H 895" class="message" />
    <text x="750" y="410" class="message-text">12. awrap_model_call()</text>
    <rect x="895" y="415" width="10" height="80" class="activation" />
    <text x="750" y="440" class="message-text" style="font-style: italic;">(메모리/기술 프롬프트 주입)</text>

    <!-- 13. LLM call (implicit) -->
    <path d="M 900 460 L 980 460" class="message" />
    <text x="910" y="455" class="message-text">13. LLM 호출</text>

    <!-- 14. Streaming back -->
    <path d="M 895 485 H 700" class="reply-message" />
    <text x="750" y="495" class="message-text">14. 모델 응답 (스트리밍)</text>

    <!-- Note: Tool Usage -->
    <rect x="650" y="520" width="220" height="60" class="note-box" />
    <text x="760" y="540" class="note-text" text-anchor="middle">에이전트가 도구를 사용하기로 결정</text>
    <text x="760" y="560" class="note-text" text-anchor="middle">(예: read_file)</text>

    <!-- 15. HITL Interrupt -->
    <path d="M 700 590 H 500" class="reply-message" />
    <text x="550" y="600" class="message-text">15. HITL 중단 발생</text>

    <!-- 16. Prompt for approval -->
    <path d="M 500 615 H 105" class="reply-message" />
    <text x="250" y="625" class="message-text">16. 도구 사용 승인 요청</text>

    <!-- 17. User approves -->
    <path d="M 105 650 H 500" class="message" />
    <text x="250" y="645" class="message-text">17. 사용자 승인</text>

    <!-- 18. Resume agent -->
    <path d="M 500 670 H 695" class="message" />
    <text x="550" y="665" class="message-text">18. agent.astream(resume=...)</text>

    <!-- 19. Execute Tool -->
    <path d="M 700 690 H 1095" class="message" />
    <text x="850" y="685" class="message-text">19. 도구 실행 (예: FilesystemBackend)</text>
    <rect x="1095" y="690" width="10" height="50" class="activation" />

    <!-- 20. Tool Result -->
    <path d="M 1095 730 H 700" class="reply-message" />
    <text x="850" y="740" class="message-text">20. 도구 결과</text>

    <!-- 21. Continue Streaming to LLM -->
    <path d="M 700 760 H 895" class="message" />
    <text x="750" y="755" class="message-text">21. awrap_model_call()</text>
     <rect x="895" y="760" width="10" height="80" class="activation" />
    <text x="760" y="785" class="message-text" style="font-style: italic;">(도구 결과를 포함하여 프롬프트 주입)</text>

    <path d="M 900 800 L 980 800" class="message" />
    <text x="910" y="795" class="message-text">22. LLM 호출</text>

    <path d="M 895 830 H 700" class="reply-message" />
    <text x="750" y="840" class="message-text">23. 최종 응답 (스트리밍)</text>

    <!-- 24. Final response streaming to UI -->
    <path d="M 695 870 H 500" class="reply-message" />
    <text x="550" y="880" class="message-text">24. 최종 AI 메시지 스트림</text>

    <path d="M 495 900 H 300" class="reply-message" />
    <text x="350" y="910" class="message-text">25. UI에 텍스트 렌더링</text>

    <!-- 26. UI to User -->
    <path d="M 300 930 H 105" class="reply-message" />
    <text x="150" y="940" class="message-text">26. 최종 출력 표시</text>

    <!-- Loop -->
     <rect x="80" y="980" width="1040" height="80" class="note-box" />
     <text x="600" y="1020" class="note-text" text-anchor="middle">사용자가 '종료'를 입력하거나 Ctrl+C를 누를 때까지 루프가 계속됩니다.</text>

</svg>