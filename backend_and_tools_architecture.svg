<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-bt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
        <filter id="shadow-bt">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
            <feOffset dx="3" dy="3" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 2; filter: url(#shadow-bt); }
            .intent-layer { fill: #E3F2FD; stroke: #64B5F6; }
            .bridge-layer { fill: #FFFDE7; stroke: #FFD54F; }
            .execution-layer { fill: #FCE4EC; stroke: #F06292; }
            .protocol-box { fill: #F3E5F5; stroke: #CE93D8; }
            .impl-box { fill: #E1BEE7; stroke: #BA68C8; }
            .composite-box { fill: #D1C4E9; stroke: #9575CD; }
            .title { font-size: 28px; font-weight: bold; text-anchor: middle; }
            .subtitle { font-size: 20px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 16px; text-anchor: middle; }
            .text-small { font-size: 13px; text-anchor: middle; }
            .text-mono { font-size: 14px; font-family: monospace; }
            .connector { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow-bt); }
            .flow-line { stroke: #555; stroke-width: 1.5; stroke-dasharray: 8 4; marker-end: url(#arrow-bt); }
        </style>
    </defs>

    <text x="800" y="50" class="title">后端与工具 (Backend &amp; Tools) 架构详解</text>
    <text x="800" y="80" class="text">意图 (Intent) 与 执行 (Execution) 的分离</text>

    <!-- Layer Titles -->
    <text x="250" y="130" class="subtitle">意图层 (LLM)</text>
    <text x="800" y="130" class="subtitle">桥接层 (Tools in Middleware)</text>
    <text x="1350" y="130" class="subtitle">执行层 (Backends)</text>
    <line x1="500" y1="110" x2="500" y2="1050" stroke="#BDBDBD" stroke-width="2" />
    <line x1="1100" y1="110" x2="1100" y2="1050" stroke="#BDBDBD" stroke-width="2" />

    <!-- Intent Layer -->
    <g id="intent-layer">
        <rect x="50" y="160" width="400" height="150" rx="15" class="box intent-layer" />
        <text x="250" y="200" class="text">LLM 生成决策</text>
        <text x="250" y="240" class="text-mono" fill="#0D47A1">Tool Call:</text>
        <text x="250" y="265" class="text-mono" fill="#0D47A1">read_file(path="/app/src/main.py")</text>
    </g>

    <path d="M 450 235 H 550" class="connector" />

    <!-- Bridge Layer -->
    <g id="bridge-layer">
        <rect x="550" y="160" width="500" height="850" rx="15" class="box bridge-layer" />
        <text x="800" y="200" class="subtitle">工具 (Tools)</text>

        <rect x="575" y="240" width="450" height="100" rx="10" class="box bridge-layer" />
        <text x="800" y="270" class="text" font-weight="bold">read_file 工具</text>
        <text x="800" y="300" class="text-small">1. 接收参数: path="/app/src/main.py"</text>
        <text x="800" y="320" class="text-small" fill="#D32F2F">2. 安全校验: _validate_path(path)</text>

        <rect x="575" y="380" width="450" height="100" rx="10" class="box bridge-layer" />
        <text x="800" y="410" class="text" font-weight="bold">execute 工具</text>
        <text x="800" y="440" class="text-small">1. 接收参数: command="pytest"</text>
        <text x="800" y="460" class="text-small" fill="#00796B">2. (条件性可用)</text>

        <text x="800" y="520" class="text">...</text>

        <text x="800" y="800" class="subtitle">核心职责</text>
        <text x="800" y="830" class="text" fill="#C62828" font-weight="bold">不包含任何执行逻辑</text>
        <text x="800" y="860" class="text">将请求委派给后端</text>
        <text x="800" y="890" class="text-mono">backend.read(validated_path)</text>
        <text x="800" y="910" class="text-mono">backend.execute(command)</text>
    </g>

    <path d="M 1025 310 H 1125" class="connector" />
    <path d="M 1025 430 H 1125" class="connector" />
     <text x="1060" y="300" class="text-small">委派请求</text>


    <!-- Execution Layer -->
    <g id="execution-layer">
        <rect x="1150" y="160" width="400" height="200" rx="10" class="box protocol-box" />
        <text x="1350" y="190" class="subtitle">接口协议 (Strategy Interface)</text>
        <text x="1350" y="230" class="text-mono">BackendProtocol</text>
        <text x="1350" y="255" class="text-mono">  .read(), .write(), .ls()...</text>
        <text x="1350" y="290" class="text-mono">SandboxBackendProtocol</text>
        <text x="1350" y="315" class="text-mono">  .execute()</text>

        <path d="M 1350 360 V 410" class="flow-line" />
        <text x="1350" y="390" class="text-small">被具体实现</text>

        <rect x="1125" y="410" width="450" height="600" rx="15" class="box execution-layer" />
        <text x="1350" y="450" class="subtitle">具体后端 (Concrete Strategies)</text>

        <rect x="1150" y="480" width="180" height="120" rx="10" class="box impl-box" />
        <text x="1240" y="510" class="text" font-weight="bold">StateBackend</text>
        <text x="1240" y="540" class="text-small">纯内存实现</text>
        <text x="1240" y="565" class="text-small">(AgentState)</text>

        <rect x="1370" y="480" width="180" height="120" rx="10" class="box impl-box" />
        <text x="1460" y="510" class="text" font-weight="bold">FilesystemBackend</text>
        <text x="1460" y="540" class="text-small">本地磁盘</text>
        <text x="1460" y="565" class="text-small">(os.* commands)</text>

        <rect x="1150" y="620" width="180" height="120" rx="10" class="box impl-box" />
        <text x="1240" y="650" class="text" font-weight="bold">SandboxBackend</text>
        <text x="1240" y="680" class="text-small">远程沙箱</text>
        <text x="1240" y="705" class="text-small">(API calls)</text>

        <rect x="1370" y="620" width="180" height="120" rx="10" class="box impl-box" />
        <text x="1460" y="650" class="text" font-weight="bold">CustomBackend</text>
        <text x="1460" y="680" class="text-small">自定义实现</text>
        <text x="1460" y="705" class="text-small">(e.g., Database)</text>

        <rect x="1150" y="760" width="400" height="230" rx="10" class="box composite-box" />
        <text x="1350" y="790" class="subtitle">CompositeBackend (路由器)</text>
        <text x="1350" y="820" class="text-small">根据路径前缀将请求路由到不同后端</text>
        <text x="1170" y="850" text-anchor="start" class="text-mono">
            if path.startswith("/mem"):
        </text>
        <text x="1190" y="870" text-anchor="start" class="text-mono" fill="#1A237E">
            return StateBackend.read()
        </text>
        <text x="1170" y="890" text-anchor="start" class="text-mono">
            elif path.startswith("/ws"):
        </text>
        <text x="1190" y="910" text-anchor="start" class="text-mono" fill="#1A237E">
            return FilesystemBackend.read()
        </text>
         <text x="1170" y="930" text-anchor="start" class="text-mono">
            else:
        </text>
        <text x="1190" y="950" text-anchor="start" class="text-mono" fill="#1A237E">
            return SandboxBackend.read()
        </text>

    </g>

</svg>