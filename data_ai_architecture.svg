<svg width="960" height="720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" style="background-color:#f9f9f9;">
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
        <style>
            .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; rx: 8; ry: 8; }
            .agent-box { fill: #e6f7ff; stroke: #1890ff; }
            .backend-box { fill: #f6ffed; stroke: #52c41a; }
            .data-box { fill: #fffbe6; stroke: #faad14; }
            .text-title { font-size: 16px; font-weight: bold; fill: #333; }
            .text-body { font-size: 12px; fill: #555; }
            .text-path { font-size: 11px; fill: #0050b3; font-style: italic; }
            .flow-line { stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
            .data-flow-line { stroke: #1890ff; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; stroke-dasharray: 4 2; }
        </style>
    </defs>

    <!-- Title -->
    <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Data+AI 线上故障诊断系统架构</text>

    <!-- User -->
    <g id="user">
        <rect x="410" y="70" width="140" height="50" class="box" style="fill: #fff0f6; stroke: #eb2f96;" />
        <text x="480" y="100" text-anchor="middle" class="text-title">用户 (User)</text>
    </g>
    <path class="flow-line" d="M 480 120 V 155" />
    <text x="490" y="145" class="text-body">1. 发起查询</text>

    <!-- Orchestrator Agent -->
    <g id="orchestrator">
        <rect x="330" y="160" width="300" height="90" class="box agent-box" />
        <text x="480" y="185" text-anchor="middle" class="text-title">主智能体 (Orchestrator Agent)</text>
        <text x="480" y="210" text-anchor="middle" class="text-body">任务规划 / 任务分发 / 结果合成</text>
    </g>
    <path class="flow-line" d="M 480 250 V 280" />
     <text x="490" y="270" class="text-body">2. 任务分解与分发</text>

    <!-- Sub-agents -->
    <g id="sub-agents">
        <!-- Data Retrieval -->
        <g>
            <rect x="80" y="285" width="220" height="70" class="box agent-box" />
            <text x="190" y="310" text-anchor="middle" class="text-title">数据拉取智能体</text>
            <text x="190" y="335" text-anchor="middle" class="text-body">(Data Retrieval Agent)</text>
        </g>
        <!-- Data Analysis -->
        <g>
             <rect x="370" y="285" width="220" height="70" class="box agent-box" />
            <text x="480" y="310" text-anchor="middle" class="text-title">数据分析智能体</text>
             <text x="480" y="335" text-anchor="middle" class="text-body">(Data Analysis Agent)</text>
        </g>
        <!-- Data Visualization -->
        <g>
            <rect x="660" y="285" width="220" height="70" class="box agent-box" />
            <text x="770" y="310" text-anchor="middle" class="text-title">数据可视化智能体</text>
            <text x="770" y="335" text-anchor="middle" class="text-body">(Data Visualization Agent)</text>
        </g>
        <path class="flow-line" d="M 480 280 H 190" />
        <path class="flow-line" d="M 480 280 H 480" />
        <path class="flow-line" d="M 480 280 H 770" />
    </g>

    <!-- Composite Backend Layer -->
     <g id="composite-backend">
        <rect x="40" y="440" width="880" height="180" class="box" style="fill: #fafafa; stroke-dasharray: 5 5;" />
        <text x="480" y="465" text-anchor="middle" class="text-title" style="fill:#8c8c8c;">CompositeBackend (统一文件系统抽象层)</text>
     </g>

    <!-- Backends -->
    <g id="backends">
        <!-- Filesystem Backend -->
        <g>
            <rect x="80" y="490" width="380" height="110" class="box backend-box" />
            <text x="270" y="520" text-anchor="middle" class="text-title">文件系统后端 (FilesystemBackend)</text>
            <text x="270" y="550" text-anchor="middle" class="text-body">管理持久化数据 (日志, 指标等)</text>
            <text x="270" y="575" text-anchor="middle" class="text-path">挂载点: /data/</text>
        </g>
        <!-- Sandbox Backend -->
        <g>
            <rect x="500" y="490" width="380" height="110" class="box backend-box" />
            <text x="690" y="520" text-anchor="middle" class="text-title">沙箱后端 (SandboxBackend)</text>
            <text x="690" y="550" text-anchor="middle" class="text-body">管理会话内文件 (代码, 结果, 图表)</text>
             <text x="690" y="575" text-anchor="middle" class="text-path">挂载点: /workspace/ (默认)</text>
        </g>
    </g>

    <!-- Data Sources -->
    <g id="data-sources">
        <rect x="80" y="365" width="220" height="60" class="box data-box" />
        <text x="190" y="390" text-anchor="middle" class="text-title">外部数据源</text>
        <text x="190" y="410" text-anchor="middle" class="text-body">(数据库, API, 日志系统)</text>
    </g>

    <!-- Data Flow Lines -->
    <path class="data-flow-line" d="M 190 355 V 365" />
    <text x="140" y="380" class="text-body" style="font-size:10px;"></text>
    <path class="data-flow-line" d="M 190 425 V 490" />
    <text x="200" y="460" class="text-body" style="fill:#1890ff;">3. 写入原始数据</text>

    <path class="data-flow-line" d="M 370 490 V 355" />
    <text x="280" y="420" class="text-body" style="fill:#1890ff;">4. 读取原始数据</text>

    <path class="data-flow-line" d="M 480 355 V 490" />
    <text x="490" y="420" class="text-body" style="fill:#1890ff;">5. 写入分析结果</text>

    <path class="data-flow-line" d="M 660 490 V 355" />
    <text x="540" y="420" class="text-body" style="fill:#1890ff;">6. 读取分析结果</text>

    <path class="data-flow-line" d="M 770 355 V 490" />
    <text x="780" y="420" class="text-body" style="fill:#1890ff;">7. 写入可视化图表</text>

    <!-- Final Report Flow -->
    <path class="flow-line" d="M 330 205 H 150 V 100 H 410" />
    <text x="200" y="140" class="text-body">8. 汇总并生成最终报告</text>

</svg>
