<svg width="1500" height="1200" viewBox="0 0 1500 1200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-skill" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
        <filter id="shadow-skill">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
            <feOffset dx="3" dy="3" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 2; filter: url(#shadow-skill); }
            .phase-box { fill: #F5F5F5; stroke: #BDBDBD; }
            .mw-box { fill: #FFFDE7; stroke: #FFD54F; }
            .fs-box { fill: #E0F2F1; stroke: #80CBC4; }
            .llm-box { fill: #E3F2FD; stroke: #64B5F6; }
            .func-name { font-family: monospace; font-size: 13px; fill: #00796B; font-weight: bold; }
            .title { font-size: 28px; font-weight: bold; text-anchor: middle; }
            .subtitle { font-size: 20px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 16px; text-anchor: middle; }
            .text-small { font-size: 13px; text-anchor: middle; }
            .connector { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow-skill); }
        </style>
    </defs>

    <text x="750" y="50" class="title">技能 (Skills) 加载与使用流程详解</text>
    <text x="750" y="80" class="text">(包含关键函数名)</text>

    <!-- Phase 1: Skill Loading -->
    <g id="phase-loading">
        <rect x="50" y="120" width="1400" height="380" rx="15" class="box phase-box" />
        <text x="750" y="160" class="subtitle">阶段一: 技能发现与加载 (Agent 启动时)</text>

        <rect x="100" y="200" width="300" height="120" rx="10" class="box fs-box" />
        <text x="250" y="230" class="text">用户技能目录</text>
        <text x="250" y="260" class="text-mono">~/.deepagents/skills/</text>
        <text x="250" y="290" class="text-small">web-research/SKILL.md</text>
        <text x="250" y="310" class="text-small">code-review/SKILL.md</text>

        <rect x="450" y="200" width="300" height="120" rx="10" class="box fs-box" />
        <text x="600" y="230" class="text">项目技能目录</text>
        <text x="600" y="260" class="text-mono">.deepagents/skills/</text>
        <text x="600" y="290" class="text-small">project-tooling/SKILL.md</text>

        <rect x="800" y="200" width="600" height="280" rx="10" class="box mw-box" />
        <text x="1100" y="235" class="text" font-weight="bold">SkillsMiddleware</text>
        <text x="1100" y="265" class="func-name">.before_agent()</text>
        <text x="1100" y="290" class="text-small">调用加载函数</text>
        <path d="M 1100 300 V 320" class="connector" />
        <text x="1100" y="340" class="func-name">list_skills(user_dir, project_dir)</text>
        <text x="1100" y="365" class="text-small">扫描目录, 解析元数据, 处理覆盖</text>
        <path d="M 1100 375 V 395" class="connector" />
        <text x="1100" y="415" class="func-name">_parse_skill_metadata(file_path)</text>
        <text x="1100" y="440" class="text-small">结果存入 AgentState['skills_metadata']</text>

        <path d="M 400 260 H 800" class="connector" />
        <path d="M 750 260 H 800" class="connector" />
        <text x="600" y="190" class="text-small">文件系统作为输入</text>
    </g>

    <!-- Phase 2: Prompt Injection -->
    <g id="phase-injection">
        <rect x="50" y="550" width="1400" height="280" rx="15" class="box phase-box" />
        <text x="750" y="590" class="subtitle">阶段二: 动态提示注入 (模型调用前)</text>

        <rect x="100" y="630" width="600" height="180" rx="10" class="box mw-box" />
        <text x="400" y="665" class="text" font-weight="bold">SkillsMiddleware</text>
        <text x="400" y="695" class="func-name">.wrap_model_call()</text>
        <text x="400" y="720" class="text-small">1. 从 AgentState 读取 `skills_metadata`</text>
        <text x="400" y="745" class="text-small">2. 调用格式化函数</text>
        <text x="400" y="770" class="func-name">._format_skills_list(metadata)</text>
        <text x="400" y="795" class="text-small">3. 将结果注入 SKILLS_SYSTEM_PROMPT</text>

        <rect x="800" y="630" width="600" height="180" rx="10" class="box llm-box" />
        <text x="1100" y="660" class="text">最终注入到系统提示的内容</text>
        <text x="820" y="690" text-anchor="start" class="text-mono" font-weight="bold">**Available Skills:**</text>
        <text x="820" y="715" text-anchor="start" class="text-mono">- **web-research**: Conducts research...</text>
        <text x="820" y="735" text-anchor="start" class="text-mono" fill="#0D47A1">  → Read `~/.deepagents/.../SKILL.md`</text>
        <text x="820" y="760" text-anchor="start" class="text-mono">- **project-tooling**: Runs project tools...</text>
        <text x="820" y="780" text-anchor="start" class="text-mono" fill="#0D47A1">  → Read `./.deepagents/.../SKILL.md`</text>

        <path d="M 700 725 H 800" class="connector" />
    </g>

    <!-- Phase 3: Skill Usage by LLM -->
    <g id="phase-usage">
        <rect x="50" y="880" width="1400" height="280" rx="15" class="box phase-box" />
        <text x="750" y="920" class="subtitle">阶段三: 技能的使用 (渐进式披露)</text>

        <rect x="100" y="960" width="400" height="180" rx="10" class="box llm-box" />
        <text x="300" y="990" class="text">1. LLM 接收到任务</text>
        <text x="300" y="1020" class="text-small">"请帮我研究A主题"</text>
        <text x="300" y="1050" class="text">2. LLM 匹配可用技能</text>
        <text x="300" y="1080" class="text-small">"web-research" 技能描述最匹配</text>
        <text x="300" y="1110" class="text">3. LLM 决定读取技能详情</text>

        <path d="M 500 1050 H 580" class="connector" />
        <text x="540" y="1040" class="text-small">生成工具调用</text>

        <rect x="580" y="960" width="400" height="180" rx="10" class="box mw-box" />
        <text x="780" y="1020" class="text">FilesystemMiddleware 执行</text>
        <text x="780" y="1060" class="func-name">read_file(path="...")</text>
        <text x="780" y="1090" class="text-small">返回 `SKILL.md` 的完整内容</text>

        <path d="M 980 1050 H 1060" class="connector" />
        <text x="1020" y="1040" class="text-small">返回工具结果</text>

        <rect x="1060" y="960" width="340" height="180" rx="10" class="box llm-box" />
        <text x="1230" y="990" class="text">4. LLM 接收技能详情</text>
        <text x="1230" y="1020" class="text-small">`ToolMessage` 包含 `SKILL.md` 内容</text>
        <text x="1230" y="1050" class="text">5. LLM 根据技能指令</text>
        <text x="1230" y="1080" class="text-small">执行后续操作 (如 `search`)</text>
    </g>
</svg>