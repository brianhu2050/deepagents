<svg width="1500" height="1200" viewBox="0 0 1500 1200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-ds" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
        <filter id="shadow-ds">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
            <feOffset dx="3" dy="3" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 2; filter: url(#shadow-ds); }
            .state-def { fill: #E3F2FD; stroke: #64B5F6; }
            .state-comp { fill: #FFFDE7; stroke: #FFD54F; }
            .state-final { fill: #E8F5E9; stroke: #81C784; }
            .flow-box { fill: #F5F5F5; stroke: #BDBDBD; }
            .title { font-size: 28px; font-weight: bold; text-anchor: middle; }
            .subtitle { font-size: 20px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 16px; text-anchor: middle; }
            .text-small { font-size: 13px; text-anchor: middle; }
            .text-mono { font-size: 14px; font-family: monospace; }
            .connector { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow-ds); }
        </style>
    </defs>

    <text x="750" y="50" class="title">数据与状态 (Data &amp; State) 架构与生命周期</text>

    <!-- Part 1: State Composition -->
    <g id="state-composition">
        <text x="400" y="120" class="subtitle">第一部分: AgentState 的组合</text>
        <line x1="50" y1="140" x2="750" y2="140" stroke="#BDBDBD" stroke-width="2" />

        <rect x="100" y="170" width="600" height="80" rx="10" class="box state-def" />
        <text x="400" y="200" class="text" font-weight="bold">Base AgentState</text>
        <text x="400" y="230" class="text-mono">messages: list[BaseMessage]</text>

        <path d="M 200 250 V 300" class="connector" />
        <path d="M 400 250 V 300" class="connector" />
        <path d="M 600 250 V 300" class="connector" />
        <text x="400" y="280" class="text-small">被中间件继承和扩展</text>

        <rect x="50" y="300" width="250" height="100" rx="10" class="box state-comp" />
        <text x="175" y="330" class="text">FilesystemState</text>
        <text x="175" y="360" class="text-mono" fill="#0D47A1">+ files: dict</text>

        <rect x="325" y="300" width="250" height="100" rx="10" class="box state-comp" />
        <text x="450" y="330" class="text">SkillsState</text>
        <text x="450" y="360" class="text-mono" fill="#0D47A1">+ skills_metadata: list</text>

        <rect x="600" y="300" width="250" height="100" rx="10" class="box state-comp" />
        <text x="725" y="330" class="text">TodoState</text>
        <text x="725" y="360" class="text-mono" fill="#0D47A1">+ todos: list</text>

        <path d="M 175 400 V 450" class="connector" />
        <path d="M 450 400 V 450" class="connector" />
        <path d="M 725 400 V 450" class="connector" />
        <text x="450" y="430" class="text-small">在 Agent 创建时动态组合</text>

        <rect x="100" y="450" width="700" height="150" rx="15" class="box state-final" />
        <text x="450" y="485" class="subtitle">最终的完整 AgentState</text>
        <text x="450" y="520" class="text-mono">messages: list[BaseMessage]</text>
        <text x="450" y="545" class="text-mono">files: dict</text>
        <text x="450" y="570" class="text-mono">skills_metadata: list</text>
    </g>

    <!-- Part 2: Data Lifecycle -->
    <g id="data-lifecycle">
        <text x="1100" y="120" class="subtitle">第二部分: 数据的生命周期</text>
        <line x1="800" y1="140" x2="1450" y2="140" stroke="#BDBDBD" stroke-width="2" />

        <rect x="850" y="170" width="500" height="980" rx="15" class="box flow-box" />
        <text x="1100" y="210" class="subtitle">Agent 运行循环</text>

        <g id="step1">
            <circle cx="900" cy="260" r="20" fill="#BDBDBD" />
            <text x="900" y="265" fill="white" font-weight="bold" font-size="18">1</text>
            <text x="940" y="255" text-anchor="start" class="text" font-weight="bold">初始化</text>
            <text x="940" y="280" text-anchor="start" class="text-small">创建包含 `HumanMessage` 的初始 State</text>
        </g>
        <path d="M 1100 300 V 350" class="connector" />

        <g id="step2">
            <circle cx="900" cy="390" r="20" fill="#BDBDBD" />
            <text x="900" y="395" fill="white" font-weight="bold" font-size="18">2</text>
            <text x="940" y="365" text-anchor="start" class="text" font-weight="bold">预处理 (`before_agent`)</text>
            <text x="940" y="390" text-anchor="start" class="text-small" fill="#00796B">填充: `skills_metadata` 被加载</text>
            <text x="940" y="415" text-anchor="start" class="text-small" fill="#D32F2F">修复: `messages` 被 `PatchToolCalls` 清理</text>
        </g>
        <path d="M 1100 440 V 490" class="connector" />

        <g id="step3">
            <circle cx="900" cy="530" r="20" fill="#BDBDBD" />
            <text x="900" y="535" fill="white" font-weight="bold" font-size="18">3</text>
            <text x="940" y="505" text-anchor="start" class="text" font-weight="bold">模型调用 (`wrap_model_call`)</text>
            <text x="940" y="530" text-anchor="start" class="text-small">读取: `skills_metadata` 用于构建 Prompt</text>
            <text x="940" y="555" text-anchor="start" class="text-small">读取: `messages` 作为对话历史</text>
            <text x="940" y="580" text-anchor="start" class="text-small" font-weight="bold">➡️ 发送给 LLM</text>
        </g>
        <path d="M 1100 600 V 650" class="connector" />

        <g id="step4">
            <circle cx="900" cy="690" r="20" fill="#BDBDBD" />
            <text x="900" y="695" fill="white" font-weight="bold" font-size="18">4</text>
            <text x="940" y="665" text-anchor="start" class="text" font-weight="bold">工具执行 (`wrap_tool_call`)</text>
            <text x="940" y="690" text-anchor="start" class="text-small">LLM 返回 `AIMessage` (含 `tool_calls`)</text>
            <text x="940" y="715" text-anchor="start" class="text-small">工具被调用, 生成 `ToolMessage`</text>
            <text x="940" y="740" text-anchor="start" class="text-small">或 `Command` (包含对 `files` 的更新)</text>
        </g>
        <path d="M 1100 760 V 810" class="connector" />

        <g id="step5">
            <circle cx="900" cy="850" r="20" fill="#BDBDBD" />
            <text x="900" y="855" fill="white" font-weight="bold" font-size="18">5</text>
            <text x="940" y="825" text-anchor="start" class="text" font-weight="bold">状态更新</text>
            <text x="940" y="850" text-anchor="start" class="text-small">`AIMessage` 和 `ToolMessage` 被追加到 `messages`</text>
            <text x="940" y="875" text-anchor="start" class="text-small">`files` 和 `todos` 根据 `Command` 或 Reducer 合并</text>
        </g>

        <path d="M 1100 900 V 950" class="connector" />

        <g id="step6">
             <path d="M 1100 950 A 150 150, 0, 1, 0, 1100 300" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow-ds)" />
             <text x="1280" y="625" class="text" font-weight="bold">循环</text>
             <text x="1280" y="650" class="text-small">更新后的 State</text>
             <text x="1280" y="670" class="text-small">成为下一次循环的输入</text>
        </g>

    </g>

</svg>