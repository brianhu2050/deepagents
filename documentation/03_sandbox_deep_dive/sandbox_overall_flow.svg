<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-sof" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
        <filter id="shadow-sof">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
            <feOffset dx="3" dy="3" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 2; filter: url(#shadow-sof); }
            .layer-box { fill: #F5F5F5; stroke: #BDBDBD; }
            .agent-box { fill: #E3F2FD; stroke: #64B5F6; }
            .mw-box { fill: #FFFDE7; stroke: #FFD54F; }
            .protocol-box { fill: #F3E5F5; stroke: #CE93D8; }
            .base-box { fill: #EDE7F6; stroke: #B39DDB; }
            .impl-box { fill: #FCE4EC; stroke: #F06292; }
            .title { font-size: 28px; font-weight: bold; text-anchor: middle; }
            .subtitle { font-size: 20px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 16px; text-anchor: middle; }
            .text-small { font-size: 13px; text-anchor: middle; }
            .text-mono { font-size: 14px; font-family: monospace; }
            .connector { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow-sof); }
        </style>
    </defs>

    <text x="600" y="50" class="title">Sandbox 整体实现与调用流程</text>

    <!-- Agent Layer -->
    <g id="agent-layer">
        <rect x="50" y="100" width="1100" height="200" rx="15" class="box layer-box" />
        <text x="600" y="140" class="subtitle">1. Agent 核心 &amp; 中间件层</text>

        <rect x="100" y="180" width="450" height="100" rx="10" class="box agent-box" />
        <text x="325" y="210" class="text">LLM 决策</text>
        <text x="325" y="240" class="text-small">(基于被动态注入的 `EXECUTION_SYSTEM_PROMPT`)</text>
        <text x="325" y="265" class="text-mono" fill="#0D47A1">Tool Call: execute("npm test")</text>

        <rect x="650" y="180" width="450" height="100" rx="10" class="box mw-box" />
        <text x="875" y="210" class="text">FilesystemMiddleware</text>
        <text x="875" y="240" class="text-small">捕获工具调用, 准备委派</text>
        <text x="875" y="265" class="text-mono">self.backend.execute("npm test")</text>
    </g>

    <path d="M 550 230 H 650" class="connector" />
    <path d="M 875 280 V 350" class="connector" />
    <text x="885" y="320" class="text-small">调用 backend 实例</text>

    <!-- Protocol Layer -->
    <g id="protocol-layer">
        <rect x="50" y="350" width="1100" height="200" rx="15" class="box layer-box" />
        <text x="600" y="390" class="subtitle">2. 协议层 (The "What")</text>

        <rect x="400" y="430" width="400" height="100" rx="10" class="box protocol-box" />
        <text x="600" y="460" class="text" font-weight="bold">SandboxBackendProtocol</text>
        <text x="600" y="490" class="text-small">定义了必须实现的接口</text>
        <text x="600" y="515" class="text-mono">def execute(self, command: str) -> ExecuteResponse:</text>
    </g>

    <path d="M 600 530 V 600" class="connector" />
    <text x="610" y="570" class="text-small">被抽象基类实现</text>

    <!-- ABC Layer -->
    <g id="abc-layer">
        <rect x="50" y="600" width="1100" height="300" rx="15" class="box layer-box" />
        <text x="600" y="640" class="subtitle">3. 抽象基类层 (The "How, Generally")</text>

        <rect x="400" y="680" width="400" height="200" rx="10" class="box base-box" />
        <text x="600" y="710" class="text" font-weight="bold">BaseSandbox</text>
        <text x="600" y="740" class="text-small" fill="#C62828">**强制**子类实现 `execute`</text>
        <text x="600" y="760" class="text-mono">@abstractmethod</text>
        <text x="600" y="780" class="text-mono">def execute(...)</text>
        <line x1="420" y1="800" x2="780" y2="800" stroke="#B39DDB" stroke-width="1.5" />
        <text x="600" y="825" class="text-small" fill="#1A237E">**提供**基于 `execute` 的文件操作</text>
        <text x="600" y="845" class="text-mono">def read(self, path):</text>
        <text x="600" y="865" class="text-mono" font-size="12">  return self.execute(f"cat {path}")</text>
    </g>

    <path d="M 600 880 V 950" class="connector" />
    <text x="610" y="920" class="text-small">被具体子类继承</text>

    <!-- Concrete Impl Layer -->
    <g id="impl-layer">
        <rect x="50" y="950" width="1100" height="500" rx="15" class="box layer-box" />
        <text x="600" y="990" class="subtitle">4. 具体实现层 (The "How, Specifically")</text>

        <rect x="80" y="1030" width="320" height="150" rx="10" class="box impl-box" />
        <text x="240" y="1060" class="text" font-weight="bold">DaytonaBackend</text>
        <text x="240" y="1090" class="text-mono" fill="#C62828">def execute(...):</text>
        <text x="240" y="1115" class="text-small">  return daytona.process.exec(...)</text>
        <text x="240" y="1145" class="text-small">(同步阻塞式 API)</text>

        <rect x="440" y="1030" width="320" height="150" rx="10" class="box impl-box" />
        <text x="600" y="1060" class="text" font-weight="bold">ModalBackend</text>
        <text x="600" y="1090" class="text-mono" fill="#C62828">def execute(...):</text>
        <text x="600" y="1115" class="text-small">  proc = modal.sandbox.exec(...)</text>
        <text x="600" y="1130" class="text-small">  proc.wait()</text>
        <text x="600" y="1155" class="text-small">(异步风格 API, 需显式等待)</text>

        <rect x="800" y="1030" width="320" height="150" rx="10" class="box impl-box" />
        <text x="960" y="1060" class="text" font-weight="bold">RunloopBackend</text>
        <text x="960" y="1090" class="text-mono" fill="#C62828">def execute(...):</text>
        <text x="960" y="1115" class="text-small">  return runloop.devboxes...</text>
        <text x="960" y="1130" class="text-small">  .execute_and_await_completion(...)</text>
        <text x="960" y="1155" class="text-small">(同步高级别 API)</text>

        <text x="600" y="1220" class="text" font-weight="bold">调用 `execute` 时...</text>
        <path d="M 875 280 V
 1030 H 600" class="connector" stroke-dasharray="8 4" />
        <text x="750" y="900" class="text-small">假设 `ModalBackend` 被选中</text>

        <text x="600" y="1280" class="text">调用 `read` (未被子类覆盖) 时...</text>
        <path d="M 600, 880 C 600,880 200,950 200,1200" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow-sof)" stroke-dasharray="8 4" />
        <text x="350" y="1250" class="text-small">1. 调用 `BaseSandbox.read()`</text>
        <path d="M 200, 1200 C 200,1200 450,1230 450,1180" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow-sof)" stroke-dasharray="8 4" />
        <text x="320" y="1320" class="text-small">2. `BaseSandbox.read()` 内部</text>
        <text x="320" y="1340" class="text-small">   调用 `self.execute()` (即 `ModalBackend.execute()`)</text>

    </g>

</svg>