<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Defs for markers and gradients -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c5c"/>
        </marker>
    </defs>

    <!-- Styles -->
    <style>
        .container { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box { stroke: #d1d5db; stroke-width: 1.5; border-radius: 8px; }
        .title { font-size: 16px; font-weight: 600; fill: #1f2937; }
        .desc { font-size: 12px; fill: #6b7280; }
        .arrow-line { stroke: #5c5c5c; stroke-width: 2; marker-end: url(#arrow); }
        .label { font-size: 12px; font-weight: 500; fill: #374151; }
    </style>

    <g class="container">
        <!-- Boxes -->
        <rect x="50" y="50" width="200" height="100" fill="#f9fafb" class="box"/>
        <text x="150" y="80" text-anchor="middle" class="title">用户 (User)</text>
        <text x="150" y="105" text-anchor="middle" class="desc">"请帮我运行测试"</text>

        <rect x="50" y="250" width="200" height="100" fill="#f9fafb" class="box"/>
        <text x="150" y="280" text-anchor="middle" class="title">Deep Agent</text>
        <text x="150" y="305" text-anchor="middle" class="desc">LLM 决定调用 `execute` 工具</text>

        <rect x="300" y="250" width="200" height="100" fill="#f3f4f6" class="box"/>
        <text x="400" y="280" text-anchor="middle" class="title">FilesystemMiddleware</text>
        <text x="400" y="305" text-anchor="middle" class="desc">将 `execute` 委托给后端</text>

        <rect x="300" y="450" width="200" height="100" fill="#f3f4f6" class="box"/>
        <text x="400" y="480" text-anchor="middle" class="title">DaytonaBackend</text>
        <text x="400" y="505" text-anchor="middle" class="desc">通过 API 调用沙箱</text>

        <rect x="550" y="350" width="200" height="100" fill="#eef2ff" class="box"/>
        <text x="650" y="380" text-anchor="middle" class="title">Daytona Sandbox</text>
        <text x="650" y="405" text-anchor="middle" class="desc">隔离的执行环境 (容器)</text>

        <!-- Arrows and Labels -->
        <path d="M 150 150 Q 150 200 150 240" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
        <text x="160" y="200" class="label">1. 用户请求</text>

        <path d="M 250 300 L 290 300" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
        <text x="255" y="290" class="label">2. 工具调用</text>

        <path d="M 400 350 Q 400 400 400 440" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
        <text x="410" y="400" class="label">3. 委托执行</text>

        <path d="M 500 480 Q 550 450 550 420" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
        <text x="505" y="455" class="label">4. Daytona API 调用</text>
        <text x="505" y="470" class="desc">`execute("pytest")`</text>

        <path d="M 550 380 Q 500 350 500 320" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="5,5"/>
        <text x="495" y="355" class="label">5. 返回结果</text>
        <text x="495" y="370" class="desc">`stdout`, `stderr`</text>

        <path d="M 300 480 Q 250 450 250 320" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="5,5"/>
        <text x="230" y="400" class="label">6. 封装为 ToolMessage</text>
    </g>
</svg>