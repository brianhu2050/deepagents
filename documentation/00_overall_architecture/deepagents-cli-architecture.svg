<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="sans-serif">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
        <filter id="shadow" x="-0.1" y="-0.1" width="1.2" height="1.2">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
            <feOffset in="blur" dx="2" dy="2" result="offsetBlur" />
            <feMerge>
                <feMergeNode in="offsetBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .swimlane-title { font-size: 22px; font-weight: bold; text-anchor: middle; }
            .component-box { rx: 8; ry: 8; filter: url(#shadow); stroke-width: 2; }
            .framework-box { fill: #E8F5E9; stroke: #66BB6A; }
            .app-box { fill: #E3F2FD; stroke: #42A5F5; }
            .interface-box { fill: #FFFDE7; stroke: #FFD54F; font-style: italic; }
            .component-title { font-size: 16px; font-weight: bold; text-anchor: middle; }
            .component-desc { font-size: 13px; text-anchor: middle; }
            .code-font { font-family: monospace; font-size: 12px; }
            .flow-line { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow); }
            .flow-label { font-size: 12px; fill: #E65100; font-weight: bold; }
        </style>
    </defs>

    <title>Deep Agents - 详细技术架构图 (CLI 与 Core 分离)</title>

    <!-- Swimlanes -->
    <rect x="10" y="80" width="785" height="1100" fill="#FAFAFA" stroke="#D0D0D0" stroke-width="1" />
    <text x="402.5" y="110" class="swimlane-title">`deepagents` (核心框架)</text>
    <rect x="805" y="80" width="785" height="1100" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1" />
    <text x="1197.5" y="110" class="swimlane-title">`deepagents-cli` (应用实现)</text>

    <text x="800" y="50" font-size="28" text-anchor="middle" font-weight:bold;>整体技术架构: `deepagents` 核心与 `deepagents-cli` 应用</text>

    <!-- deepagents Core Framework Lane -->
    <g id="framework-components">
        <!-- Agent Core -->
        <rect x="50" y="150" width="700" height="200" class="component-box framework-box" />
        <text x="400" y="180" class="component-title">Agent (智能体)</text>
        <text x="400" y="210" class="component-desc">核心状态机和执行逻辑</text>
        <path d="M 60 230 H 740" stroke="#66BB6A" stroke-dasharray="4 4" />
        <text x="400" y="260" class="component-desc" fill="#333"><tspan x="400" dy="0">基于 LangGraph 的可中断图 (Pregel)</tspan><tspan x="400" dy="20">管理 `AgentState` 的生命周期</tspan></text>
        <text x="400" y="310" class="code-font">[libs/deepagents/agent.py]</text>

        <!-- Middleware Abstract -->
        <rect x="50" y="400" width="700" height="150" class="component-box interface-box" />
        <text x="400" y="430" class="component-title">AgentMiddleware (抽象中间件)</text>
        <text x="400" y="460" class="component-desc">定义了用于扩展 Agent 功能的接口</text>
        <text x="400" y="500" class="code-font" fill="#333"><tspan x="400" dy="0">`before_agent`, `before_model_call`,</tspan><tspan x="400" dy="20">`wrap_model_call`, `before_tool_call`</tspan></text>
        <text x="400" y="535" class="code-font">[libs/deepagents/middleware.py]</text>

        <!-- Sandbox Abstract -->
        <rect x="50" y="600" width="700" height="220" class="component-box interface-box" />
        <text x="400" y="630" class="component-title">Sandbox (沙箱抽象)</text>
        <text x="400" y="660" class="component-desc">定义了与外部环境交互的统一接口</text>
        <path d="M 60 680 H 740" stroke="#FFD54F" stroke-dasharray="4 4" />
        <text x="400" y="710" class="component-desc" font-weight="bold">BaseSandbox</text>
        <text x="400" y="730" class="component-desc">将文件操作 (`ls`, `read`, `write`) 转换为 Shell 命令</text>
        <text x="400" y="750" class="code-font">[libs/deepagents/sandbox.py]</text>
        <text x="400" y="790" class="component-desc" font-weight="bold">SandboxBackendProtocol</text>
        <text x="400" y="810" class="component-desc">定义了后端必须实现的 `execute` 方法</text>
        <text x="400" y="830" class="code-font">[libs/deepagents/backends/protocol.py]</text>

        <!-- Other Core Components -->
        <rect x="50" y="870" width="340" height="120" class="component-box framework-box" />
        <text x="220" y="900" class="component-title">AgentState</text>
        <text x="220" y="930" class="component-desc">定义 Agent 的状态模型 (消息, 工具调用)</text>
        <text x="220" y="960" class="code-font">[libs/deepagents/state.py]</text>

        <rect x="410" y="870" width="340" height="120" class="component-box framework-box" />
        <text x="580" y="900" class="component-title">AgentMemory</text>
        <text x="580" y="930" class="component-desc">管理 Agent 的长期和短期记忆</text>
        <text x="580" y="960" class="code-font">[libs/deepagents/agent_memory.py]</text>
    </g>

    <!-- deepagents-cli Application Lane -->
    <g id="application-components">
        <rect x="850" y="150" width="700" height="130" class="component-box app-box" />
        <text x="1200" y="180" class="component-title">CLI Application</text>
        <text x="1200" y="210" class="component-desc"><tspan x="1200">用户交互, 命令解析 (Typer),</tspan><tspan x="1200" dy="20">UI 渲染 (Rich)</tspan></text>
        <text x="1200" y="250" class="code-font">[libs/deepagents-cli/main.py]</text>

        <!-- Middleware Implementations -->
        <rect x="850" y="320" width="700" height="230" class="component-box app-box" />
        <text x="1200" y="350" class="component-title">Middleware Implementations (中间件实现)</text>
        <text x="1200" y="380" class="component-desc">具体的业务逻辑实现</text>
        <path d="M 860 400 H 1540" stroke="#42A5F5" stroke-dasharray="4 4" />
        <text x="1200" y="430" class="component-desc" fill="#333"><tspan font-weight="bold">SkillsMiddleware:</tspan> 管理和注入可用技能</tspan>
        <text x="1200" y="455" class="component-desc" fill="#333"><tspan font-weight="bold">SandboxMiddleware:</tspan> 将工具调用路由到沙箱</tspan>
        <text x="1200" y="480" class="component-desc" fill="#333"><tspan font-weight="bold">AgentMemoryMiddleware:</tspan> 将记忆连接到 Agent</tspan>
        <text x="1200" y="505" class="component-desc" fill="#333"><tspan font-weight="bold">...and others</tspan></text>
        <text x="1200" y="530" class="code-font">[libs/deepagents-cli/middlewares/*]</text>

        <!-- Sandbox Implementations -->
        <rect x="850" y="600" width="700" height="220" class="component-box app-box" />
        <text x="1200" y="630" class="component-title">Sandbox Backend Implementations (沙箱后端实现)</text>
        <text x="1200" y="660" class="component-desc">具体的环境执行逻辑</text>
        <path d="M 860 680 H 1540" stroke="#42A5F5" stroke-dasharray="4 4" />
        <text x="1200" y="710" class="component-desc" fill="#333"><tspan font-weight="bold">DaytonaBackend:</tspan> 通过 Daytona API 与开发环境交互</tspan>
        <text x="1200" y="740" class="component-desc" fill="#333"><tspan font-weight="bold">ModalBackend:</tspan> 在 Modal Labs 上下文中执行</tspan>
        <text x="1200" y="770" class="component-desc" fill="#333"><tspan font-weight="bold">RunloopBackend:</tspan> 本地 Shell 执行</tspan>
        <text x="1200" y="800" class="code-font">[libs/deepagents-cli/backends/*]</text>

        <!-- User -->
        <g transform="translate(1200, 950)">
             <circle cx="0" cy="0" r="40" class="component-box" fill="#FFF3E0" stroke="#FFB74D" />
             <text y="5" text-anchor="middle" font-size="16">用户</text>
             <text y="25" text-anchor="middle" font-size="12">(Developer)</text>
        </g>
    </g>

    <!-- Connectors and Flows -->
    <g id="flows">
        <!-- Vertical Inheritance/Implementation Flow -->
        <path d="M 750 475 H 850" class="flow-line" />
        <text x="765" y="465" class="flow-label">1. 实现</text>

        <path d="M 750 710 H 850" class="flow-line" />
        <text x="765" y="700" class="flow-label">2. 实现</text>

        <!-- Main Request/Response Flow -->
        <path d="M 1200 890 V 280" class="flow-line" />
        <text x="1210" y="600" class="flow-label">3. 用户输入</text>

        <path d="M 1200 280 .. controls 1000,280 and 1000,320 .. 1200 320" stroke="none" fill="none" id="path-app-mid"/>
        <path d="M 1200 280 Q 1100 280 1100 370 Q 1100 460 1200 460" class="flow-line" stroke-dasharray="5 5" />
        <text x="950" y="395" class="flow-label">4. CLI组装中间件</text>

        <path d="M 850 475 H 800 V 250 H 750" class="flow-line" />
        <text x="690" y="385" class="flow-label">5. 中间件包装 Agent</text>

        <path d="M 400 350 V 400" class="flow-line" />
        <text x="410" y="380" class="flow-label">6. Agent 调用模型 (通过 wrap_)</text>

        <path d="M 400 550 V 600" class="flow-line" />
        <text x="410" y="580" class="flow-label">7. Agent 请求工具调用 (通过中间件)</text>

        <path d="M 1200 550 V 600" class="flow-line" />
        <text x="1210" y="580" class="flow-label">8. SandboxMiddleware 路由到具体后端</text>

        <path d="M 1200 820 V 870" class="flow-line" />
        <text x="1210" y="850" class="flow-label">9. 后端执行命令</text>

        <path d="M 1150 870 .. controls 1100,800 and 1100,300 .. 1150 280" class="flow-line" stroke-dasharray="8 4" />
        <text x="1050" y="550" class="flow-label">10. 结果返回并呈现给用户</text>
    </g>
</svg>
