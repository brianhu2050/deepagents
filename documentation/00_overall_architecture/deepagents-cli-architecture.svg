<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-main" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
        </marker>
        <filter id="shadow-main" x="-0.2" y="-0.2" width="1.4" height="1.4">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
            <feOffset in="blur" dx="3" dy="3" result="offsetBlur" />
            <feMerge>
                <feMergeNode in="offsetBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 2; filter: url(#shadow-main); }
            .user-layer { fill: #E3F2FD; stroke: #90CAF9; }
            .app-layer { fill: #FFF3E0; stroke: #FFB74D; }
            .agent-core { fill: #E8F5E9; stroke: #A5D6A7; }
            .middleware-layer { fill: #FCE4EC; stroke: #F48FB1; }
            .detailed-module { fill: #EDE7F6; stroke: #B39DDB; }
            .ext-service { fill: #FBE9E7; stroke: #FFAB91; }

            .title { font-size: 18px; text-anchor: middle; }
            .component-text { font-size: 14px; text-anchor: middle; }
            .connector-text { font-size: 13px; fill: #444; }
            .ref-text { font-size: 12px; fill: #673AB7; font-style: italic; text-anchor: middle; }
            .flow-line { stroke: #555; stroke-width: 2.5; marker-end: url(#arrow-main); }
            .data-flow-line { stroke: #0288D1; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#arrow-main); }
        </style>
    </defs>

    <text x="600" y="50" font-size="28" text-anchor="middle">Deep Agents CLI - 高层技术架构图</text>

    <!-- Layers -->
    <g id="user-layer">
        <rect x="500" y="100" width="200" height="70" rx="10" class="box user-layer" />
        <text x="600" y="130" class="title">用户</text>
        <text x="600" y="150" class="component-text">终端 (Terminal)</text>
    </g>

    <g id="app-layer">
        <rect x="300" y="220" width="600" height="120" rx="10" class="box app-layer" />
        <text x="600" y="250" class="title">应用层 (Application)</text>
        <text x="600" y="280" class="component-text">`deepagents-cli` 入口, 命令解析, UI渲染 (Rich)</text>
        <text x="600" y="305" class="component-text" font-family="monospace">main.py, execution.py</text>
    </g>

    <g id="agent-core-layer">
        <rect x="300" y="390" width="600" height="220" rx="10" class="box agent-core" />
        <text x="600" y="420" class="title">智能体核心 (Agent Core)</text>
        <text x="600" y="450" class="component-text">基于 LangGraph 的可中断状态机 (Pregel)</text>
        <text x="600" y="475" class="component-text" font-family="monospace">agent.py</text>

        <rect x="325" y="500" width="550" height="90" rx="5" class="box middleware-layer"/>
        <text x="600" y="530" class="title" font-size="16">中间件栈 (Middleware Stack)</text>
        <text x="600" y="560" class="component-text">通过 `wrap_` 方法为 Agent 添加可组合的能力</text>
        <text x="600" y="580" class="ref-text">(详见: module-architecture-middleware.svg)</text>
    </g>

    <g id="detailed-modules-layer">
        <rect x="50" y="660" width="500" height="250" rx="10" class="box detailed-module" />
        <text x="300" y="700" class="title">后端与工具 (Backend &amp; Tools)</text>
        <text x="300" y="740" class="component-text">提供与外部世界交互的执行层</text>
        <text x="300" y="770" class="component-text">(文件系统, 沙箱, API)</text>
        <text x="300" y="810" class="ref-text">详见:</text>
        <text x="300" y="830" class="ref-text" >backend_and_tools_architecture.svg</text>

        <rect x="650" y="660" width="500" height="250" rx="10" class="box detailed-module" style="fill: #E0F2F1; stroke: #80CBC4;" />
        <text x="900" y="700" class="title">数据与状态 (Data &amp; State)</text>
        <text x="900" y="740" class="component-text">定义 Agent 的记忆和工作区</text>
        <text x="900" y="770" class="component-text">(消息历史, 文件缓存, 技能元数据)</text>
        <text x="900" y="810" class="ref-text">详见:</text>
        <text x="900" y="830" class="ref-text" >data_and_state_architecture.svg</text>
    </g>

    <g id="external-services-layer">
        <rect x="900" y="390" width="250" height="220" rx="10" class="box ext-service" />
        <text x="1025" y="485" class="title">外部服务</text>
        <text x="1025" y="515" class="component-text">LLM (Claude, GPT)</text>
        <text x="1025" y="540" class="component-text">Tavily (搜索)</text>
    </g>

    <!-- Connectors -->
    <path d="M 600 170 V 220" class="flow-line" />
    <text x="610" y="200" class="connector-text">执行 CLI 命令</text>

    <path d="M 600 340 V 390" class="flow-line" />
    <text x="610" y="370" class="connector-text">创建并运行 Agent</text>

    <path d="M 600 610 V 660" class="flow-line" />
    <text x="500" y="640" class="connector-text">工具调用 (委派)</text>
    <path d="M 450 660 H 600" class="flow-line" />
    <text x="500" y="880" class="connector-text">工具结果 (返回)</text>
    <path d="M 450 910 H 600 V 610" class="flow-line" />

    <path d="M 750 610 V 660" class="data-flow-line" />
    <text x="760" y="640" class="connector-text" fill="#0288D1">读/写状态</text>

    <path d="M 900 485 H 850" class="data-flow-line" />
    <path d="M 850 515 H 900" class="data-flow-line" />
    <text x="790" y="505" class="connector-text" fill="#0288D1">模型请求/响应</text>

    <path d="M 300 910 V 950 H 1025 V 610" class="data-flow-line" />
    <text x="600" y="935" class="connector-text" fill="#0288D1">某些后端直接访问外部服务</text>

</svg>