<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #282c34; }
      .adapter { fill: #21252b; stroke: #61afef; stroke-width: 2; rx: 10; }
      .client { fill: #2c313a; stroke: #c678dd; stroke-width: 1.5; rx: 8; }
      .agent { fill: #2c313a; stroke: #e5c07b; stroke-width: 1.5; rx: 8; }
      .main-text { fill: #e6e6e6; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .sub-text { fill: #abb2bf; font-size: 15px; text-anchor: middle; }
      .arrow { stroke: #98c379; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-text { fill: #98c379; font-size: 14px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <title>acp (Agent Client Protocol) 适配器架构</title>

  <!-- ACP Adapter -->
  <g id="acp-adapter">
    <rect x="275" y="150" width="250" height="100" class="adapter"/>
    <text x="400" y="190" class="main-text">ACP Adapter</text>
    <text x="400" y="215" class="sub-text">(请求/响应转换层)</text>
  </g>

  <!-- External Client -->
  <g id="external-client">
    <rect x="50" y="162.5" width="180" height="75" class="client"/>
    <text x="140" y="190" class="sub-text">外部客户端</text>
    <text x="140" y="210" class="sub-text">(ACP Compliant)</text>
  </g>

  <!-- DeepAgent Instance -->
  <g id="deepagent-instance">
    <rect x="570" y="162.5" width="180" height="75" class="agent"/>
    <text x="660" y="190" class="sub-text">Deep Agent 实例</text>
    <text x="660" y="210" class="sub-text">(Core Logic)</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M 230 200 H 275"/>
  <text x="252.5" y="190" class="arrow-text">ACP 请求</text>

  <path class="arrow" d="M 525 200 H 570"/>
  <text x="547.5" y="190" class="arrow-text">调用</text>

  <path class="arrow" d="M 525 220 H 275" marker-end="none" marker-start="url(#arrowhead)"/>
  <path d="M 525 220 H 570" style="stroke:none;fill:none"/>
  <path d="M 230 220 H 275" style="stroke:none;fill:none"/>
  <marker id="arrowhead-reverse" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#98c379" />
  </marker>
  <path class="arrow" d="M 570 230 H 525" />
  <text x="547.5" y="245" class="arrow-text">返回</text>

  <path class="arrow" d="M 275 230 H 230" />
  <text x="252.5" y="245" class="arrow-text">ACP 响应</text>

</svg>