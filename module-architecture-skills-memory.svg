<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
    <defs>
        <marker id="arrow-mod3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
        </marker>
        <filter id="shadow-mod3" x="-0.2" y="-0.2" width="1.4" height="1.4">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
            <feOffset in="blur" dx="2" dy="2" result="offsetBlur" />
            <feMerge>
                <feMergeNode in="offsetBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .box { stroke-width: 1.5; filter: url(#shadow-mod3); }
            .memory-mod { fill: #FCE4EC; stroke: #F48FB1; }
            .skills-mod { fill: #E1BEE7; stroke: #BA68C8; }
            .sub-component { fill: #F8BBD0; stroke: #F06292; }
            .sub-component-skill { fill: #CE93D8; stroke: #AB47BC; }
            .data-source { fill: #E0F2F1; stroke: #80CBC4; }
            .external-dep { fill: #F5F5F5; stroke: #BDBDBD; }
            .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
            .text { font-size: 13px; text-anchor: middle; }
            .connector { stroke: #555; stroke-width: 2; marker-end: url(#arrow-mod3); }
            .data-flow { stroke: #0288D1; stroke-width: 1.5; stroke-dasharray: 4 2; marker-end: url(#arrow-mod3); }
        </style>
    </defs>

    <text x="450" y="40" font-size="20" font-weight="bold" text-anchor="middle">모듈 아키텍처: 기술 및 메모리</text>

    <!-- Agent Core (External) -->
    <rect x="350" y="80" width="200" height="60" rx="5" class="box external-dep" />
    <text x="450" y="115" class="text">에이전트 코어 (시스템 프롬프트)</text>

    <!-- Memory Module -->
    <g>
        <rect x="50" y="180" width="380" height="200" rx="10" class="box memory-mod" />
        <text x="240" y="205" class="title">메모리 모듈</text>
        <rect x="70" y="230" width="340" height="130" rx="5" class="box sub-component" />
        <text x="240" y="255" class="text">AgentMemoryMiddleware</text>
        <text x="240" y="285" class="text" style="font-weight:bold;">기능:</text>
        <text x="240" y="305" class="text">- `agent.md` 파일 로드</text>
        <text x="240" y="325" class="text">- 사용자 및 프로젝트 메모리 분리</text>
        <text x="240" y="345" class="text">- 프롬프트에 메모리 주입</text>
    </g>

    <!-- Skills Module -->
    <g>
        <rect x="470" y="180" width="380" height="200" rx="10" class="box skills-mod" />
        <text x="660" y="205" class="title">기술 모듈</text>
        <rect x="490" y="230" width="340" height="130" rx="5" class="box sub-component-skill" />
        <text x="660" y="255" class="text">SkillsMiddleware &amp; load.py</text>
        <text x="660" y="285" class="text" style="font-weight:bold;">기능:</text>
        <text x="660" y="305" class="text">- `SKILL.md` 메타데이터 파싱</text>
        <text x="660" y="325" class="text">- 점진적 공개</text>
        <text x="660" y="345" class="text">- 프롬프트에 기술 목록 주입</text>
    </g>

    <!-- Data Sources -->
    <g>
        <rect x="50" y="420" width="800" height="240" rx="10" class="box data-source" />
        <text x="450" y="445" class="title">데이터 소스 (파일 시스템)</text>

        <!-- User Data -->
        <rect x="70" y="470" width="360" height="170" rx="5" class="box" style="fill:#B2DFDB;" />
        <text x="250" y="495" class="text" style="font-weight:bold;">~/.deepagents/&lt;agent&gt;/</text>

        <path d="M 90 520 L 410 520 L 410 580 L 90 580 Z" class="box" style="fill:#FFF; stroke:#80CBC4;" />
        <text x="250" y="550" class="text">agent.md (사용자 메모리)</text>

        <path d="M 90 590 L 410 590 L 410 620 L 90 620 Z" class="box" style="fill:#FFF; stroke:#80CBC4;" />
        <text x="250" y="605" class="text">skills/ (사용자 기술)</text>

        <!-- Project Data -->
        <rect x="470" y="470" width="360" height="170" rx="5" class="box" style="fill:#B2DFDB;" />
        <text x="650" y="495" class="text" style="font-weight:bold;">&lt;project&gt;/.deepagents/</text>

        <path d="M 490 520 L 810 520 L 810 580 L 490 580 Z" class="box" style="fill:#FFF; stroke:#80CBC4;" />
        <text x="650" y="550" class="text">agent.md (프로젝트 메모리)</text>

        <path d="M 490 590 L 810 590 L 810 620 L 490 620 Z" class="box" style="fill:#FFF; stroke:#80CBC4;" />
        <text x="650" y="605" class="text">skills/ (프로젝트 기술)</text>
    </g>

    <!-- Connectors -->
    <path d="M 450 140 V 180" class="connector" />
    <text x="460" y="165" style="font-size:12px;">미들웨어 래핑</text>

    <!-- Memory to Agent -->
    <path d="M 240 180 V 140" class="data-flow" />
    <text x="150" y="165" style="font-size:12px;" fill="#0288D1">메모리 주입</text>

    <!-- Skills to Agent -->
    <path d="M 660 180 V 140" class="data-flow" />
    <text x="670" y="165" style="font-size:12px;" fill="#0288D1">기술 목록 주입</text>

    <!-- Memory to Data -->
    <path d="M 240 380 V 420" class="data-flow" />
    <text x="250" y="405" style="font-size:12px;" fill="#0288D1">agent.md 읽기</text>

    <!-- Skills to Data -->
    <path d="M 660 380 V 420" class="data-flow" />
    <text x="670" y="405" style="font-size:12px;" fill="#0288D1">SKILL.md 읽기</text>

</svg>