<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #282c34; }
      .core-box { fill: #1e2228; stroke: #61afef; stroke-width: 2; rx: 10; }
      .middleware-box { fill: #2c313a; stroke: #c678dd; stroke-width: 2; rx: 8; }
      .tool-box { fill: #3e4451; stroke: #98c379; stroke-width: 1.5; rx: 5; }
      .main-text { fill: #e6e6e6; font-size: 22px; font-weight: bold; text-anchor: middle; }
      .sub-text { fill: #abb2bf; font-size: 16px; text-anchor: middle; }
      .tool-text { fill: #dcdfe4; font-size: 14px; text-anchor: middle; }
      .arrow { stroke: #e5c07b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-text { fill: #e5c07b; font-size: 14px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5c07b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <title>deepagents 内部技术架构</title>

  <!-- Main Agent Graph -->
  <g id="main-agent">
    <rect x="200" y="50" width="400" height="80" class="core-box"/>
    <text x="400" y="90" class="main-text">Deep Agent (基于 LangGraph)</text>
    <text x="400" y="115" class="sub-text">通过 create_deep_agent 创建</text>
  </g>

  <!-- Middleware Layer -->
  <g id="middlewares">
    <text x="400" y="180" class="sub-text" style="font-weight:bold;">中间件层 (Middleware Layer)</text>

    <!-- FilesystemMiddleware -->
    <g id="filesystem-middleware">
      <rect x="50" y="220" width="220" height="150" class="middleware-box"/>
      <text x="160" y="250" class="sub-text">FilesystemMiddleware</text>
      <text x="160" y="270" class="tool-text">(文件系统与上下文管理)</text>
      <rect x="70" y="290" width="180" height="70" style="fill:none; stroke:#5c6370; stroke-dasharray: 3,3; rx:5;"/>
      <g class="tools">
        <rect x="80" y="300" width="50" height="25" class="tool-box"/><text x="105" y="318" class="tool-text">ls</text>
        <rect x="140" y="300" width="80" height="25" class="tool-box"/><text x="180" y="318" class="tool-text">read_file</text>
        <rect x="80" y="330" width="85" height="25" class="tool-box"/><text x="122.5" y="348" class="tool-text">write_file</text>
        <rect x="175" y="330" width="45" height="25" class="tool-box"/><text x="197.5" y="348" class="tool-text">...</text>
      </g>
    </g>

    <!-- TodoListMiddleware -->
    <g id="todolist-middleware">
      <rect x="290" y="220" width="220" height="150" class="middleware-box"/>
      <text x="400" y="250" class="sub-text">TodoListMiddleware</text>
      <text x="400" y="270" class="tool-text">(规划与任务分解)</text>
      <rect x="310" y="290" width="180" height="70" style="fill:none; stroke:#5c6370; stroke-dasharray: 3,3; rx:5;"/>
      <g class="tools">
        <rect x="345" y="315" width="110" height="30" class="tool-box"/>
        <text x="400" y="335" class="tool-text">write_todos</text>
      </g>
    </g>

    <!-- SubAgentMiddleware -->
    <g id="subagent-middleware">
      <rect x="530" y="220" width="220" height="150" class="middleware-box"/>
      <text x="640" y="250" class="sub-text">SubAgentMiddleware</text>
      <text x="640" y="270" class="tool-text">(子代理生成与管理)</text>
      <rect x="550" y="290" width="180" height="70" style="fill:none; stroke:#5c6370; stroke-dasharray: 3,3; rx:5;"/>
      <g class="tools">
        <rect x="595" y="315" width="90" height="30" class="tool-box"/>
        <text x="640" y="335" class="tool-text">task</text>
      </g>
    </g>
  </g>

  <!-- Arrows from Agent to Middlewares -->
  <path class="arrow" d="M 300 130 V 220"/>
  <text x="280" y="175" class="arrow-text" transform="rotate(-90 280 175)">加载</text>
  <path class="arrow" d="M 400 130 V 220"/>
  <text x="420" y="175" class="arrow-text">加载</text>
  <path class="arrow" d="M 500 130 V 220"/>
  <text x="520" y="175" class="arrow-text" transform="rotate(90 520 175)">加载</text>


  <!-- External Systems/Concepts -->
  <g id="external-systems">
      <text x="400" y="420" class="sub-text" style="font-weight:bold;">外部交互 (External Interactions)</text>

      <g id="llm">
        <rect x="150" y="450" width="180" height="70" class="core-box" style="stroke:#56b6c2;"/>
        <text x="240" y="480" class="sub-text">LLM (模型)</text>
        <text x="240" y="500" class="tool-text">(如 OpenAI, Anthropic)</text>
      </g>

      <g id="tools-external">
        <rect x="450" y="450" width="200" height="70" class="core-box" style="stroke:#56b6c2;"/>
        <text x="550" y="480" class="sub-text">自定义工具</text>
        <text x="550" y="500" class="tool-text">(如 internet_search)</text>
      </g>
  </g>

  <!-- Arrows from Agent to Externals -->
  <path class="arrow" d="M 280 130 C 200 200, 200 350, 240 450" />
  <text x="200" y="300" class="arrow-text">调用</text>

  <path class="arrow" d="M 520 130 C 600 200, 600 350, 550 450" />
  <text x="600" y="300" class="arrow-text">调用</text>

</svg>